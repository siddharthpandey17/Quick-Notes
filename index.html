<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Notes</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header class="header"><div><p class="eyebrow">YOUR PERSONAL SPACE</p><h1>Quick Notes</h1><p class="subtitle">Capture ideas before they disappear.</p></div><span class="logo">✎</span></header>
<section class="editor panel"><h2 id="editor-heading">Create a note</h2><form id="note-form"><label for="note-title">Title</label><input id="note-title" type="text" maxlength="80" placeholder="e.g. Weekend plans" required><label for="note-content">Note</label><textarea id="note-content" rows="4" maxlength="3000" placeholder="Write your thoughts..." required></textarea><div class="editor-actions"><button class="primary" type="submit" id="save-button">Save note</button><button class="secondary hidden" type="button" id="cancel-edit">Cancel edit</button></div></form><p id="form-status" class="status" role="status"></p></section>
<section class="notes-section"><div class="section-heading"><div><h2>Your notes</h2><p class="subtitle">Search, edit, pin or delete your notes.</p></div><span id="note-count" class="count">0 notes</span></div><div class="toolbar"><input id="search-notes" type="search" placeholder="Search notes..."><select id="sort-notes" aria-label="Sort notes"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title">Title A–Z</option></select></div><div id="notes-grid" class="notes-grid"></div><p id="empty-state" class="empty-state">No notes yet. Create your first note above.</p></section><footer>HTML · CSS · JavaScript · localStorage</footer></main><script src="script.js"></script></body></html>
